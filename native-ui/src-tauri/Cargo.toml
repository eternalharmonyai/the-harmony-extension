[package]
name = "harmony-native-control"
version = "0.1.0"
description = "Native client shell for the Harmony localhost control backend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2"
# Needed to parse and pin the loopback chat origin in src/main.rs.
url = "2"

[profile.release]
strip = "symbols"
